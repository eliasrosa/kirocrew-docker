services:
  kirocrew:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kirocrew
    restart: unless-stopped
    ports:
      - "127.0.0.1:5476:5476"
    volumes:
      - ./data:/home/kirocrew
      - ${KIROCREW_SSH}:/home/kirocrew/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Pasta de compartilhamento host <-> container. Tudo que o host quiser
      # expor ao agente (pastas, symlinks) vai em ./shared e aparece em
      # /home/kirocrew/shared dentro do container.
      - ./shared:/home/kirocrew/shared
      # Diretorio de projetos do host, montado no MESMO caminho dentro do
      # container (path-espelhado). Assim o agente edita os repos reais do host
      # (sem duplicar em ./data) E consegue rodar 'docker compose' a partir
      # deles: como o caminho e identico dos dois lados, os volumes relativos
      # dos projetos (resolvidos pelo daemon no host) apontam para o lugar certo.
      # Este proprio repo vive em <KIROCREW_DEV>/kirocrew-docker, entao tambem
      # e coberto por este mount (clone de dentro e do host sao o MESMO
      # diretorio, evitando clones divergentes). Definir KIROCREW_DEV no .env;
      # vazio desativa o mount.
      - ${KIROCREW_DEV:-/dev/null}:${KIROCREW_DEV:-/tmp/.kirocrew-nodev}
    # privileged: true — necessário para o sandbox interno do kiro-cli 2.21+.
    # O kiro-cli usa Linux user namespaces para isolar subprocessos do agente.
    # Dentro de containers Docker o rootfs é montado com propagação 'shared',
    # e o kernel bloqueia mount --make-rprivate dentro de user namespaces filhos
    # mesmo com CAP_SYS_ADMIN. privileged: true é a única solução sem patches
    # no runtime/kernel. Consequências: seccomp e AppArmor do Docker são
    # desabilitados, mas o isolamento de filesystem/rede/PID permanece.
    # Veja docs/privileged.md para análise completa de riscos.
    privileged: true
    # seccomp customizado fica aqui para documentação, mas é ignorado pelo
    # Docker quando privileged: true está ativo.
    # security_opt:
    #   - seccomp:./kirocrew-seccomp.json
