services:
  kirocrew:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kirocrew
    restart: unless-stopped
    ports:
      - "127.0.0.1:5476:5476"
    volumes:
      - ./data:/home/kirocrew
      - ${KIROCREW_SSH}:/home/kirocrew/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Monta este proprio repo no dev/ do container, para que o clone de
      # dentro e o do host sejam o MESMO diretorio (evita clones divergentes).
      - ./:/home/kirocrew/.kiro/crew/workspace/dev/kirocrew-docker
    security_opt:
      - seccomp:./kirocrew-seccomp.json
