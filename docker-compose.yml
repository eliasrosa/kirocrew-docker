services:
  kirocrew:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kirocrew
    restart: unless-stopped
    userns_mode: "host"
    ports:
      - "127.0.0.1:5476:5476"
    volumes:
      - ./data:/home/kirocrew
      - ${KIROCREW_SSH}:/home/kirocrew/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - seccomp:./kirocrew-seccomp.json
